<body><header>FANDROP.</header><main><article><small>COLLECTION 001</small><h1>Soft Light</h1><h2>留意光停在哪裡</h2><p>這是 FANDROP 首檔收藏套組的主題卡。Soft Light 從一個看人像的小練習開始：先看臉上最亮的地方，再順著光看過去，找出陰影從哪裡變柔。</p><p>拿起手上的收藏卡，讓它慢慢朝窗邊轉一點。紙面上的反光移開時，再看一次：第一眼吸引你的，是光線，還是人物的神情？</p><aside>首檔標準收藏套組 · 包裝樣張<br>請核對認證卡與包裝標籤上的商品編號。</aside></article></main></body></html>
